services:
  - type: web
    name: personal-ai-scam-shield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGIN
        sync: false          # Set this to your Vercel frontend URL in the Render dashboard
      - key: DB_PATH
        value: /tmp/scam_shield.db
    autoDeploy: true
